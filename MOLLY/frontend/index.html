<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>МОЛЛИ — AI-помощник ПТО</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script>
    // Тема применяется до отрисовки, чтобы не было «вспышки».
    (function () {
      try {
        var t = localStorage.getItem("molly_theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <div class="toasts" id="toasts"></div>
  <noscript>Для работы МОЛЛИ нужен включённый JavaScript.</noscript>
  <script src="/static/md.js"></script>
  <script src="/static/core.js"></script>
  <script src="/static/chat.js"></script>
  <script src="/static/settings.js"></script>
  <script src="/static/mail.js"></script>
  <script src="/static/wizard.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
